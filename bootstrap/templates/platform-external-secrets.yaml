apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-external-secrets-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  generators:
    - list:
        elements:
          - env: {{ .Values.environment | quote }}
  template:
    metadata:
      name: '{{ .Values.environment }}-platform-external-secrets'
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: 'https://charts.external-secrets.io'
          chart: external-secrets
          targetRevision: 2.8.0
          helm:
            valueFiles:
              - $values/platform/external-secrets/values.yaml
        - repoURL: 'https://github.com/dragan-actions-course/mongo-gitops.git'
          targetRevision: HEAD
          ref: values
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
