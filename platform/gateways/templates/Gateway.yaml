# The Gateway resource creates the actual AWS Application Load Balancer.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
  annotations:
  # Wave -1: Create Namespace
  # Wave 0: Install Controllers & CRDs (cert-manager, external-secrets)
  # Wave 1: Apply dependent resources (ClusterIssuer, ClusterSecretStore)
  # Wave 2: Deploy Applications that consume those secrets and certificates
    argocd.argoproj.io/sync-wave: "0"  # Created SECOND (after GatewayClass exists)
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All