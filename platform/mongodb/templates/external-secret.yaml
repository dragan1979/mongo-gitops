# mongo-app-gitops-repo/
# └── platform/
#     └── mongodb/
#         ├── secret-store.yaml      # Namespaced SecretStore (Wave 1)
#         ├── external-secret.yaml   # ExternalSecret for SSM (Wave 2)
#         └── values.yaml            # Custom values for Bitnami Helm Chart
#
# A Custom Resource Definition (CRD) installed by the External Secrets Operator (ESO).
# [ AWS SSM Parameter Store ]  <--- (External Store: Real password lives in AWS)
#            │
#            ▼ (Connected via SecretStore authentication)
#[ External Secrets Operator ]
#            │
#            ▼ (Follows instructions in ExternalSecret YAML)
#[ Native K8s Secret ]         <--- (The Secret: Local K8s secret generated)
#            │
#            ▼
#[ Bitnami MongoDB / App Pod ] <--- (Reads local K8s secret)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-credentials
  namespace: mongodb-system    # <--- Same namespace
  annotations:
    argocd.argoproj.io/sync-wave: "2" # <--- Wave 2: Next, fetch secret using the store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore          # <--- Points to namespaced SecretStore
  target:
    name: mongo-credentials
    creationPolicy: Owner
  data:
    - secretKey: mongodb-root-password
      remoteRef:
        key: "/mongo-app/{{ .Values.environment }}/mongodb/admin"
    - secretKey: mongodb-passwords
      remoteRef:
        key: "/mongo-app/{{ .Values.environment }}/mongodb/user"